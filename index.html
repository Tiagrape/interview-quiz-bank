<style>
  :root { --red:#c0392b; --ink:#1f2328; --sub:#57606a; --line:#e3e6ea; --bg:#f6f7f9; }
  * { box-sizing: border-box; }
  body { margin:0; padding:0 16px 40px; background:var(--bg); color:var(--ink);
         font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;

  header { background:var(--red); color:#fff; margin:0 -16px 20px; padding:18px 16px; }

  .card p { margin:0 0 12px; font-size:13px; color:var(--sub); }
  .btns { display:flex; gap:10px; flex-wrap:wrap; }
  a.btn { flex:1 1 120px; text-align:center; text-decoration:none; font-size:14px;
          padding:9px 12px; border-radius:8px; background:var(--red); color:#fff; }
  a.btn.ghost { background:#fff; color:var(--red); border:1px solid var(--red); }
  footer { margin-top:24px; font-size:12px; color:var(--sub); text-align:center; }
